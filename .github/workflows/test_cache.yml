name: Docker Build with Layer Caching

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: test_cache



jobs:
  turn_on_self_hosted:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: check directory contents
        run: ls -rtlha
      - name: install openstack
        run: pip install python-openstackclient
      - run: |
            mkdir -p ~/.config/openstack
            echo "$OPENSTACK_CLOUD" > ~/.config/openstack/clouds.yaml
        env:
          OPENSTACK_CLOUD: ${{ secrets.OPENSTACK_CLOUD}}
      - run: openstack --os-cloud=$CLOUD_NAME server list 
        env:
          CLOUD_NAME: ${{secrets.CLOUD_NAME}}
          OPENSTACK_CLOUD: ${{ secrets.OPENSTACK_CLOUD}}
      - run: |
             python3 - << EOF
             import openstack

             # Initialize connection from a clouds.yaml by passing a cloud name
             conn = openstack.connect(cloud='TRA220030_IU')
             print("con", conn)
             server_id =""
             for server in conn.compute.servers():
                 print(server)
                 if server.name =="actions-runner":
                     if server.status =="SHELVED_OFFLOADED":
                         server.unshelve(conn.compute)
                         # use the built in wait for server
                         conn.compute.wait_for_server(server,"ACTIVE",wait=5*60)
                         print("we have reached unshelved complete")
                     break
             EOF
  changes:
      needs: 
        - turn_on_self_hosted
      name: "Changed Singularity Recipes"
      runs-on: self-hosted
      # runs-on: ubuntu-latest
      outputs:
        changed_file: ${{ steps.files.outputs.added_modified }}
      steps:
        - id: files
          uses: jitterbit/get-changed-files@b17fbb00bdc0c0f63fcf166580804b4d2cdc2a42
          with:
            format: 'json'
            files: |
              **/*
            ignore: |
              **/*.yml
    
  build:
    needs:
      - changes
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      # Keep going on other deployments if anything bloops
      fail-fast: false
      matrix:
        changed_file: ${{ fromJSON(needs.changes.outputs.changed_file) }}
    name: Check ${{matrix.changed_file}}
    steps:
      - name: docker restart
        run: sudo systemctl restart docker
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./${{matrix.changed_file}}
          tags: ghcr.io/devinbayly/${{matrix.changed_file}}:latest
          push: true
          cache-from: type=registry,ref=ghcr.io/devinbayly/${{matrix.changed_file}}:buildcache
          cache-to: type=registry,ref=ghcr.io/devinbayly/${{matrix.changed_file}}:buildcache,mode=max
  turn_off_self_hosted:
    needs:
      - build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: check directory contents
        run: ls -rtlha
      - name: install openstack
        run: pip install python-openstackclient
      - run: |
            mkdir -p ~/.config/openstack
            echo "$OPENSTACK_CLOUD" > ~/.config/openstack/clouds.yaml
        env:
          OPENSTACK_CLOUD: ${{ secrets.OPENSTACK_CLOUD}}
      - run: openstack --os-cloud=$CLOUD_NAME server list 
        env:
          CLOUD_NAME: ${{secrets.CLOUD_NAME}}
          OPENSTACK_CLOUD: ${{ secrets.OPENSTACK_CLOUD}}
      - run: |
             python3 - << EOF
             import openstack

             # Initialize connection from a clouds.yaml by passing a cloud name
             conn = openstack.connect(cloud='TRA220030_IU')
             print("con", conn)
             server_id =""
             for server in conn.compute.servers():
                 print(server)
                 if server.name =="actions-runner":
                     if server.status =="ACTIVE":
                         server.shelve(conn.compute)
                         # use the built in wait for server
                         conn.compute.wait_for_server(server,"SHELVED_OFFLOADED",wait=5*60)
                         print("we have reached shelved complete")
                     break
             EOF
